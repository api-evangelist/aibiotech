aid: aibiotech
name: AiBiotech
description: >-
  AiBiotech (AIBioTech, American International Biotechnology) was a Richmond, Virginia contract
  research organization and CLIA/CAP clinical laboratory offering molecular biology, immunochemistry,
  protein expression, peptide chemistry, bioanalytical mass spectrometry, microbiology, BSL3 virology,
  genetic identity and forensic DNA analysis to pharmaceutical, biotech, academic and government
  clients. It was a wet-lab services business, not a software company, and never published an API,
  SDK, webhook surface or developer portal. Its domain aibiotech.com is now a HugeDomains for-sale
  parking lander answering HTTP 200 with the same sale page on every path; the last archived snapshot
  of a real company site dates to 2017. Laboratory directories list the operation under Granger
  Genetics, which makes no first-party claim to the brand, so no successor host is wired here.
